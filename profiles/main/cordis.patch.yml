# 我们的补丁层：叠在 dsh.profile.bundles 的所有 bundle 层之上，后写者赢（按 id 逐行定位）。
#
# 两种操作：
#   - insert: [...]        往树里加行（无 id 加到根列表，有 id 加进那个 group）
#   - id: <已有行>  config: {...}   按 id 覆盖已有行的字段（config 是整块替换，不是深合并）
#
# 相对路径的基准是本目录（profiles/main/）。

# 开启插件源码热重载。
# dsh-base 里 hmr 的默认是 root: []（模块监视关闭）——补丁层对 config 是**整块替换**，
# 所以这里要写完整。root 相对 baseDir 解析，而 baseDir = ctx.baseUrl = 本 profile 目录。
# 效果：改 plugins/*.ts 会自动重载；不改则要重启进程。
- id: hmr
  config:
    root: ['./plugins']

# 凭证走**本机 DSH 的那一份**（C:\Users\<你>\.dsh\.credentials.yaml），而不是复制一份到
# $DSH_HOME：复制会过期，而且轮换后两边会不一致。里面是 DeepSeek 账号平台的 OAuth grant，
# 由下面的 llm-deepseek-account 消费。
#
# 用 USERPROFILE 拼路径而不是写死绝对路径，免得这台机器的用户名进版本库。
# 想换成独立凭证库，把 path 改掉或删掉这一节（删掉则回到 $DSH_HOME/.credentials.yaml）。
- id: credentials
  config:
    path: !!js "process.env.USERPROFILE + '/.dsh/.credentials.yaml'"

# 默认模型。
#
# `provider: deepseek-official` 是 llm-deepseek-api-key 那条路线（PROVIDER 常量在
# packages/llm/llm-deepseek-api-key/src/index.ts:15），它默认从环境变量
# DEEPSEEK_API_KEY 取 key（config.ts:16 的 apiKeyEnv 默认值就是这个名字）。
#
# 之前用的是 `deepseek-account`（账号平台 OAuth grant）。实测那条路走不通：
# 常驻会话的 turn 正常跑完、上下文也装配好了（投影缓存里 toolsTokens=5872），
# 但 tokenUsage.totals 全为 0 —— 模型调用没拿到响应。
#
# key 值在 $DSH_HOME/.env（已 gitignore），不在这里。
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash

# SiliconFlow（OpenAI 兼容）—— **主模型与 VLM 都走这一条路线**。
#
# ★ 这里只写 `config`，**不加插件行**：`llm-pi-ai` 本来就在 base 层挂着
#   （装配树里 `- id: llm-pi-ai` / `@deepseek-ai/dsh-llm-pi-ai`），
#   按 id 覆盖它的字段即可 —— 形状跟上面 `agent-default-model`、下面 `logs` 一样。
#
# ★ `providers` 是**整块替换**（补丁层对 config 不做深合并），所以这一路要写完整。
#
# 为什么选 SiliconFlow：一条 baseURL 同时给出**主模型**（纯文本）和 **VLM**（收图），
# 而 `vlm2text` 需要的正是"能收图的那一个"。DeepSeek 官方那条路（`llm-deepseek`）
# 只有文本模型，所以图像必须另找一家。
#
# ★ **模态只在这里声明一次**（`models[].input`）。`data/tcb.json` 的 `ModelConfig`
#   刻意**不带** `inputModalities` —— 两处各写一遍必然会分叉，而 llm 侧的
#   provider catalog 才是唯一真相（`ctx.llm.resolveModelInfo()` 读的就是它）。
#
# key 值在 $DSH_HOME/.env（已被 .gitignore 忽略），这里只写**环境变量名**，
# 由 `credentials` 的 credential-ref 机制解析。
- id: llm-pi-ai
  config:
    providers:
      siliconflow:
        apiKeyEnv: SILICONFLOW_API_KEY
        displayName: SiliconFlow
        # 三个合法值之一（llm-pi-ai/src/provider.ts 的 supportedProtocols）：
        # openai-completions / openai-responses / anthropic-messages。
        # SiliconFlow 是 OpenAI 兼容，所以选第一个。
        api: openai-completions
        baseURL: https://api.siliconflow.cn/v1
        models:
          # 主模型：纯文本。`input` 不写 ⇒ 用 provider 的 defaultInput（['text']）。
          - id: deepseek-ai/DeepSeek-V3.2
            name: DeepSeek-V3.2
            maxTokens: 8192
          # planner：写待办那条"恰好一行"的小模型（`interrupt_plan` 的快照 subagent）。
          #
          # ## 关思考：`thinkingFormat: qwen` ＋ 声明 `reasoningEfforts`
          #
          # 这个模型默认会吐一大段**思考链**，而它要的输出只有一行。
          # （Shiraha 那边用 `extra_params: enable_thinking = false` 关掉，
          #   注释：「关闭思考：输出直接写入 content」。）
          #
          # pi-ai 的源码把机制写得很明白（`pi-ai/dist/api/openai-completions.js`）：
          #
          #   :629  else if (compat.thinkingFormat === 'qwen' && model.reasoning)
          #   :630      params.enable_thinking = !!options?.reasoningEffort;   // ★ 顶层
          #   :638  else if (compat.thinkingFormat === 'qwen-chat-template' && model.reasoning)
          #   :640      params.chat_template_kwargs = { enable_thinking: …, … }; // 嵌套
          #
          # 所以两件事必须同时成立：
          #
          # 1. **`thinkingFormat: qwen`** —— 只有这样才发**顶层** `enable_thinking`
          #    （SiliconFlow 认顶层；嵌套的 `chat_template_kwargs` 它不认 ——
          #     上一版配的 `chatTemplateKwargs` 就栽在这儿，实测仍有 691 条 reasoning 分片）。
          #    没有 `thinkingFormat` 时那个分支压根不进，一个参数都不发 ⇒ 吃 provider 默认（开着）。
          #
          # 2. **必须声明 `reasoningEfforts`** —— 因为那个分支还有一道门 `&& model.reasoning`，
          #    而 `catalog.ts` 里 `model.reasoning` 的来源是：
          #      · 不声明 `reasoningEfforts` ⇒ 继承 catalog 能力；我们这条路线是**手写**的、
          #        没有 catalog ⇒ `reasoning: false` ⇒ **分支不进**（这就是上一版失败的另一半原因）
          #      · 声明了档位 ⇒ `reasoning: true` ⇒ 分支进
          #    声明它**不是为了用**（planner 从不请求思考档位），纯粹是让那道门打开；
          #    而请求里没有 `reasoningEffort` ⇒ `!!undefined === false` ⇒ `enable_thinking: false` ✓
          #
          # ⚠️ 校验要求"至少有一个 off 之外的档位"（`catalog.ts`），所以不能只写 `off:`。
          # ⚠️ **只加在这个模型上，绝不能放到 provider 级** —— 这一路还跑着主模型
          #    `DeepSeek-V3.2`，provider 级的 `compat` / `reasoning` 会连带改掉它。
          - id: Qwen/Qwen3.5-27B
            name: Qwen3.5-27B
            maxTokens: 512
            compat:
              thinkingFormat: qwen
            reasoningEfforts:
              off:
              high: high
          # VLM：★ 全仓唯一声明"这个模型收图"的地方。
          # `contextWindow` 不写 ⇒ 用 defaultContextWindow。
          # 实测它**不吐 reasoning**（-Instruct 那一支才是 Thinking 版）。
          - id: Qwen/Qwen3-VL-32B-Instruct
            name: Qwen3-VL-32B
            maxTokens: 2048
            input: ['text', 'image']

# 请求扩展插件：已恢复启用。曾经的 REQUEST_EXTENSION 已真正修好（见下）。
#
# 真正的元凶是 logger-console 那一行的**裸包名解析失败**：
# plugin-package-inventory-deepseek 要为每个活跃 Loader 条目找出"所属包"
# (packages/llm/plugin-package-inventory-deepseek/src/index.ts:112-125)。
# 裸包名走 packageOf()，解析不到就**直接抛错、不回落**(:124)。
#
#   @deepseek-ai/cordis-plugin-logger-console  <- 解析不到
#   （推测：它是 vendored cordis 插件，不在 DSH 安装的 dependencies+peerDependencies
#     里，所以安装作用域收集不到；dsh-base 那上百个裸包名都在，所以只有它炸）
#
# 证据（对照实验，唯一变量）：
#   启用 logger-console + 启用本插件 -> REQUEST_EXTENSION，每次模型调用都失败
#   禁用 logger-console + 启用本插件 -> finish{kind:'stop'}，48 chunk，含 usage
# 即：两行都启用时坏的是 logger-console；把本插件禁掉只是掩盖症状。
#
# 症状回顾（极具迷惑性）：每次模型调用都以
#   finish{reason:{kind:'error',failure:{code:'REQUEST_EXTENSION', ...}}}
# 结束，tokenUsage.totals 全为 0。表现是"agent 那一轮正常跑完、零错误、什么都没发生"。
#
# 两个观测工具（都不是猜）：
#   plugins/qq/probe-llm.ts  绕开整个 agent 直连 ctx.llm.stream()，把"能力层
#     (provider/凭证/网络)"与"会话层"的故障分开。它自己有个坑：必须延迟，
#     否则拿到的是 NO_ADAPTER 的竞态假象。
#   投影缓存 storages/session_projcache/sessions/<id>.json 里的 tokenUsage /
#     turnBoundary —— 就是它让我们看出"跑了但没耗 token"。
#
# TODO 真正的修复（择一）：
#   a) 把 @deepseek-ai/cordis-plugin-logger-console 加进 profile 的 dependencies
#      并 pnpm install，让它在 profile 作用域里可解析
#   b) 换一个能解析到的 logger exporter
#   c) 查清 vendored cordis 插件为何不进安装作用域（根因，最彻底）
# 修好后删掉下面这条 disable，并恢复 logger-console 那一行。

# 日志出口：dsh-logbook（`dsh plugin add dsh-logbook` 已把它加进 bundles，
# 这一行是**覆盖**它的配置 —— 所以必须是**顶层**条目，不能放进 `- insert:`）。
#
# **换掉了 cordis 自带的 logger-console**，两层原因：
#
# 一、**cordis 的数值级别是反直觉的**（error=0 info=1 warn=2 debug=3），
#     过滤是 `if (targetLevel < level) continue` —— 于是 `default: 1`
#     会**静默吞掉所有 warn 和 debug**。我们在 attention / qq-signals 里
#     写的 warn 一直没出来。logbook 的语义是"某级及更严重"，绕开了这个坑。
#
# 二、**cordis 的 exporter 处置有 bug**（上游已确认）：`exporter()` 的 disposer
#     **摘掉的是最近注册的那个而不是自己的**，所以**任何插件重载都可能摘掉
#     别的插件的日志出口**。我们开着 HMR —— 这很可能就是 db / tcb / pointer
#     的 `Service.init` 启动日志消失的机制（它们跑在挂载早期）。
#
# ⚠️ 还有一条上游 bug 仍在：内置 buffer 收不到 warn/debug。
# logbook 自己注册全捕获出口 + 从 buffer 补种，所以绕过它。
#
# ⚠️ **踩过的坑**：这一行一旦写进 `- insert:`，就变成"插入一个没有 name 的新行"，
# 于是 compatibility-preflight 的 `name.startsWith('cordis:')` 读到 undefined 直接崩，
# 整行被禁用 —— 表现是"日志全没了"，很容易误判成 logbook 不工作。
- id: logs
  config:
    ring: 2000
    stderr:
      enabled: true
      types:
        # 某级及更严重：error → warn → info → debug
        default: info
        # 开发期看 qq-adapter 的连接与收消息细节；上线前删掉这行。
        qq-adapter: debug

- insert:


    # ── 设施 ─────────────────────────────────────────────────────────
    # 数据库设施：**领域无关**（不认识 QQ），provide('db')。
    # 用 Node 内置的 node:sqlite，零依赖 —— 跟着 DSH 自己走
    # （packages/session/session-query-sqlite 也是这么用的）。
    #
    # 路径从环境变量取，**不落进版本库**：$DSH_HOME/data/plos.db。
    #
    # 注意：迁移在激活时跑（幂等），但 disposer **只关连接、不删表** ——
    # 我们的 HMR 会让插件在改文件时卸载重装，删表等于每改一次清空一次库。
    - id: db
      name: './plugins/db/index.ts'
      config:
        path: !!js "process.env.DSH_HOME + '/data/plos.db'"
        verbose: true
    # TCB 目录：一个身份 + 一套配置（模型 / 人设 / **系统提示词白名单**）。
    #
    # **放 `data/` 而【不进数据库】**（用户定案）：数据库存会话记录/图片/表情包等
    # 大批量内容；TCB 只是一份配置，显式在外方便改。
    #
    # 坏配置**抛错不激活**（Misconfiguration fails loud）—— 名字拼错的 TCB
    # 不该静默退回默认，那会让人以为"改了配置但没生效"。
    - id: tcb
      name: './plugins/tcb/index.ts'
      config:
        path: !!js "process.env.DSH_HOME + '/data/tcb.json'"
    # 图片 → 一句话：**领域无关**的服务（不认识 QQ），provide('vlm2text')。
    #
    # ★ 它**不挂在任何 agent 瀑布上**，因为 `agent/request` 改不了消息
    #   （`LlmCallConfig` 没有 messages 字段），而且"请求是 session log 的纯函数"
    #   —— 描述要调外部 VLM、是非确定性的，只能在**源头**就写进消息正文。
    #   完整理由写在 plugins/vlm2text/index.ts 的模块注释里。
    #
    # ★ 谁消费它：`qq/vlm`（把 QQ 适配器的图片描述钩子接上来）。
    #   别把 QQ 写进 vlm2text —— 那会把领域无关性弄没。
    #
    # inject ['llm','db','tcb','attachments']：
    #   llm 调 VLM；db 存描述缓存（同一张图只描述一次）；tcb 拿 VLM 的模型；
    #   attachments 把字节变成耐久附件 —— 图片进请求**只能是附件引用**
    #   （`ImageBlock.attachment` 是 `ImageAttachmentRef`，不是 base64）。
    #   所以它必须排在 db / tcb 之后。
    #
    # 两项配置都有默认值（vlmTcb='vlm'、一句描述提示词），想改再取消注释。
    - id: vlm2text
      name: './plugins/vlm2text/index.ts'
      config:
        # vlmTcb: vlm
        # prompt: 用一句话描述这张图片的内容。……
    # 当前注意力焦点：**白羽现在在哪个会话上**。**领域无关**。
    #
    # 它**曾经**是"抢占式嵌套的栈"，那个模型已被"注意力转移"取代
    # （docs/m5-preemption.md §20）：只有一个主 agent、一个会话，所以焦点是一个值。
    #
    # ★ 为什么还留着：写待办的**快照 subagent 也是在册 agent**，于是
    # `agents.list()` 不再是单义的 —— "哪个才是白羽"必须有人明确回答。
    #
    # 放 `data/` 的一个文件而**不进数据库**（用户定案）：数据库存会话记录/图片/
    # 表情包等大批量内容；焦点是小的、显式的、排障时要直接看的。
    # 每次改动即时落盘（临时文件 + 改名）。
    - id: pointer
      name: './plugins/pointer/index.ts'
      config:
        path: !!js "process.env.DSH_HOME + '/data/focus.json'"
    # 感知设施：**领域无关**（不认识 QQ），provide('perception')。
    # 领域 register() 一个信号源（pull + templates），感知层按闲时定时器拉、
    # 统一渲染【不含内容】的简报、落库、发 `perception/notice` 事件。
    #
    # 方向：**领域暴露状态，感知层统一渲染**。领域给的是结构化数据 + 模板，
    # 不是渲染好的文本 —— 这样"不写大量提示词"才成立：简报只说"有人 @ 了你"，
    # 不说"你该回话"。
    #
    # inject ['db']：感知历史要落库。所以 db 必须排在前面。
    - id: perception
      name: './plugins/perception/index.ts'
      config:
        idleIntervalMs: 1800000
        persist: true
    # ── 工具 ─────────────────────────────────────────────────────────
    # 会话历史的检索工具（**DSH 原生**，一口气五个）：
    #   session_search / session_event_search / session_trace /
    #   session_event_trace / session_event_read
    #
    # ★ 我们为什么要它：待办（`plan` 表）里**只记 `sessionId + seq`，不把那段
    # 上下文塞回来** —— 需要细节时由她自己调 `session_event_read` 去取。
    # 这正是"**忘了细节但没丢事**"（§8.6 E3）的落地方式。
    #
    # 服务侧（`session-query-sqlite`）本来就在装配里，缺的只是这个**模型可见的
    # 消费者**。它还会注册一段 `tool:session-query` 提示词（告诉模型什么时候用）——
    # ⚠️ 那段**要加进 `data/tcb.json` 的段落白名单**，否则会被 TCB 的过滤器挡掉，
    # 工具在、但模型不知道该用。
    - id: tool-session-query
      name: '@deepseek-ai/dsh-tool-session-query'

    # 「我自己多久醒一次」：让白羽调闲时间隔（`ctx.perception.setIdleIntervalMs`）。
    #
    # ★ 引擎侧早就为它写好了，缺的只是这个**模型可见的消费者**：
    #   `perception` 的方法标着「给 AI 用的工具调」，而且那个循环**刻意不用
    #   `setInterval`** —— 它"每轮结束后按当时的间隔排下一轮"，所以**她改完立刻生效**。
    #
    # 为什么单独一个插件而不是塞进 perception：那样那个设施就得注入 `tools`、
    # 认识"工具"这个概念，而别的领域只是想注册一个信号源（能力 seam 的 Consumer 角色）。
    #
    # ★ 值**不持久化**（用户定案）：重启回到 `config.idleIntervalMs`。跟 currentPriority
    #   同一条思路 —— 运行时旋钮不加状态。工具描述里写明了这件事。
    #
    # inject ['tools','perception']，所以它必须排在 perception 之后；
    # 也必须排在 qq-resident 之前 —— 启动自述由最后一行补打。
    - id: perception-tools
      name: './plugins/perception/tools.ts'

    # ── QQ 领域 ──────────────────────────────────────────────────────
    # 目录结构照 DSH 的分法：**分组在「包」级别**（qq/adapter、qq/tools…），
    # 每个包内部保持扁平 —— DSH 的 packages/<group>/<pkg>/src 也是平的
    # （查过 5 个包，src 下没有任何子目录）。
    #
    # 三层纪律的对应：
    #   qq/adapter   ① 能力 seam（执行）—— provide('qq')
    #   qq/tools     ② 工具包装（模型化）
        #   qq/pipeline  消息段 → LLM 文本（库，被 adapter 拥有，**不是插件**）
    #   qq/protocol  OneBot v11 线上类型（adapter 与 pipeline 共用）
    #   attention    响应侧 —— 订阅感知条目，决定什么值得打断她
    #   qq/resident  常驻会话

    # ① 能力 seam：OneBot v11 WebSocket 客户端，连 SnowLuma 的协议端。
    # 连不上会按退避重连，不阻塞装配 —— 协议端还没起来也能正常启动。
    #
    # accessToken 从环境变量取，**不落进版本库**：值写在 $DSH_HOME/.env
    # （已被 .gitignore 忽略），DSH 启动时经 loadLayeredEnv 的 user 层注入。
    #
    # ★★ **`config` 是整块替换，不是深合并**（本文件开头那条规则）——
    #    改名单时 `wsUrl` / `accessToken` / `selfId` 必须**一起带上**，
    #    少写一个就退回 schema 默认值（`accessToken` 默认空串 = **鉴权失效**）。
    #
    # ## 名单语义（`adapter/index.ts:418-421`）
    #
    #     allowed = (mode === 'whitelist') ? list.includes(id) : !list.includes(id)
    #
    #   · `whitelist` + 表   → **只有表里的收**
    #   · `blacklist` + 空表 → `!hit` 恒真 ⇒ **放行一切**（刻意如此：自动生成的配置
    #     不该默认拒绝所有消息。但反过来，"留空 = 什么都不收"是不对的直觉）
    #   · `whitelist` + 空表 → **谁都不收**
    #
    # 被丢的消息**彻底不存在**：在 `onMessage` 最前面就 return，不入缓冲、
    # 不存档、不产生感知信号，只打一行 debug 日志（本行下面正是 debug 级）。
    #
    # ## 群与私聊是**两套独立名单**
    #
    # 现在：**群白名单 5 个**；**私聊全放行**（blacklist + 空表，即用户给的
    # `private_list_type = blacklist` / `private_list = []` 的语义）。
    # 想什么都不收就写 `mode: whitelist` + `list: []`。
    #
    # ⚠️ **白名单里的群会被**逐条**收下**（不是"只收 @ 我的"）：白名单只决定
    #    "这个会话的消息进不进来"。而 `qq/signals` 会**把每条都存档**，顶层图片
    #    还会**逐张下载 + 调 VLM 描述**（`imageMode` 只管转发**内**的图）。
    #    所以往白名单里加一个几百人的大群，等于给那个群的每张图付费。
    - id: qq-adapter
      name: './plugins/qq/adapter/index.ts'
      config:
        wsUrl: ws://127.0.0.1:3001
        accessToken: !!js "process.env.QQ_ACCESS_TOKEN ?? ''"
        # 兜底值。适配器连上后会自己调 `get_login_info` 拿真实 QQ 并用它判 AT_ME，
        # 这里只在"还没连上就收到消息"的边缘情况下用。与实测登录号一致。
        selfId: '352699068'
        groups:
          mode: whitelist
          # 五个群。注意 `871074118` 是 300+ 人的群，见上面那条成本提醒。
          list: ['784394807', '728636404', '914615760', '1018564056', '871074118']
        private:
          # blacklist + 空表 = **所有私聊都放行**（不是"不收私聊"）。
          mode: blacklist
          list: []

    # ② 工具包装：把 ctx.qq 的能力包成模型可调用的工具。
    # inject ['tools','qq']，两者都就绪后才激活。
    - id: qq-tools
      name: './plugins/qq/tools/index.ts'

    # ③ 桥接：把领域无关的 `vlm2text` 接到 `qq` 适配器的图片描述钩子上。
    #
    # `qq/adapter` **刻意不认识模型**（`:744` 就是为这个留空的），它只留了
    # `setImageDescriber` 这个注入点；`vlm2text` 又**刻意不认识 QQ**。
    # 两个方向相反的 seam 必须有人对上 —— 放在 QQ 这一侧，因为**谁认识 qq 谁接线**。
    #
    # inject ['qq','vlm2text']，两者都就绪后才激活。
    #
    # ★ 必须排在 qq-signals **之前**：qq-signals 会 render 消息
    #   （`ctx.qq.render`），而 render 正是用这个钩子的地方。
    - id: qq-vlm
      name: './plugins/qq/vlm/index.ts'

    # 领域 → 感知：注册信号源 + 消息存档。
    #
    # 取代旧的"推内容"：领域只暴露**结构化状态**，由感知层统一渲染。
    # pull() 用 peek()/unread()，**都不推进游标** —— 看不等读过；
    # 只有 qq_read 那个工具用 drain()。（旧的 attention 在这里调 drain()，
    # 等于"感知层替你点进去了"，M3 改结构后这条路径已不存在。）
    - id: qq-signals
      name: './plugins/qq/signals/index.ts'

    # 「注意力」：订阅感知条目，决定什么值得打断她，然后唤醒 agent。
    #
    # 命名定案（见 docs/decisions.md）：词汇分三层——
    #   领域【注册信号】（状态信号 / 唤醒信号）→ 感知层采集渲染成【感知条目】
    #   → 本插件订阅条目并【分配注意力】。所以这里不叫"信号"（那是注册侧的词），
    #   也不叫"push"（它并不在推）。
    #
    # 它订阅的是**感知条目**（不是 `qq/message` 原始事件）：渲染归感知层、
    # 返回里不带行为指令、也不推进读游标。这四条是 M3 重写时定下的，
    # 也正是它能服务 QQ 之外领域（新闻 / 手表 / 手机推送）的前提。
    #
    # 职责一句话：**订阅感知条目 → 分配注意力**
    # （`deliver` / `queue` / `steer` / `cancel`，见 docs/m5-preemption.md §20）。
    - id: attention
      name: './plugins/attention/index.ts'
      config:
        # 两个注意力阈值（docs/m5-preemption.md §20.5）。不写就用插件里的默认值：
        #   pendingThreshold (n)：原任务优先级 > n 才记待办。默认 0
        #     —— 0 级任务（群聊）被中断不记，> 0 的才记。
        #   urgentThreshold (m)：打断信号优先级 >= m 走硬 cancel。默认 80。
        # 想调就取消下面两行的注释。
        # pendingThreshold: 0
        # urgentThreshold: 80

        # 说明：旧的 `trigger: mention` / `groups: []` 是 M3 之前的 attention
        # （那时它直接订阅 `qq/message`）。重写后这两个字段已不存在，
        # 写在这里会被 schema 忽略 —— 所以删掉了。

    # 中断待办：**注意力转移模型的恢复路径**（docs/m5-preemption.md §20.7）。
    #
    # 原任务优先级 > n（attention 判的）时，在【中断那一刻】同步取边界、起一个
    # 快照 subagent 看住"她当时在干什么"；中断超过 T 还没回来，就让那个 subagent
    # 把它写成一条待办、浮进她下一次唤醒的上下文，于是她想起来还有件事没做完。
    #
    # ★ 这就是"**用一条恢复路径，换掉整套上下文冻结机制**"里那条恢复路径 ——
    # 也正因为有它，主路径才不需要 fork / 结清 / 保"保证她一定回来"。
    #
    # 四个可调项（§20.5）：T（timeoutMs）/ TTL（planTtlMs）/ planner TCB / 清扫周期。
    # 不写就用插件里的默认值：T=2 分钟（§20.5 表里标的是【待定】，这是起点值）、
    # TTL=1 天、planner='planner'。想调就取消对应行的注释。
    #
    # inject ['agents','db','tcb']：要 agent 注册表（建快照 subagent）、
    # 数据库（写待办）、TCB（拿 planner 的模型配置）。所以它必须排在 db / tcb 之后。
    - id: interrupt-plan
      name: './plugins/interrupt_plan/index.ts'
      config:
        # timeoutMs: 120000
        # planTtlMs: 86400000
        # plannerTcb: planner
        # sweepIntervalMs: 600000

    # ── 优雅关闭记账：★ **故意不挂**（非必要插件）─────────────────────
    #
    # 「上次进程停止时她停在哪里」（优雅关闭原理）：临死前同步记坐标到
    # `data/last-shutdown.json`，启动时由 `qq-resident` 用
    # `ctx.get('lastShutdown')` 注入一次、然后删掉。
    #
    # **为什么不挂**：它的触发判据是**启发式的** —— 分不出"进程真的停了"和
    # "**HMR 重载了本插件**"（改一次插件文件就会卸载重装，disposer 会跑）。
    # 开发期误报会往她的上下文里塞一条假的"上次停下来了"，**干扰实验**。
    #
    # ★ 所以它是"**默认不挂**"而不是"挂着再关掉" —— `qq/resident` 那一处走
    #   `ctx.get('lastShutdown')`（**可选服务**），不挂它拿到 `undefined`，
    #   那行短路，**影响为零**。
    #
    # TODO（上游面）：要根治得有一个真正的"应用正在关闭"信号。DSH 现在把
    #   SIGINT/SIGTERM 收敛成同一个 `interrupt(code)`
    #   （apps/cli/src/profile-boot.ts:280-281），**插件侧看不出是哪种，
    #   也看不出"这是关闭还是重载"**。要么上游把这个区分透出来，
    #   要么我们换一条只有真关闭才会走的路径。
    #
    # 启用 = 取消下面三行的注释。
    # - id: last-shutdown
    #   name: './plugins/last_shutdown/index.ts'
    #   config:
    #     statePath: !!js "process.env.DSH_HOME + '/data/last-shutdown.json'"

    # 常驻 agent：进程一起来就建白羽的会话，让 QQ 那边随时有人可推。
    # headless 启动不创建 agent，没有这一行 qq-attention 会一直报"无人可推"。
    # greeting 从环境变量取（默认空 = 启动时不说话）。
    - id: qq-resident
      name: './plugins/qq/resident/index.ts'
      config:
        sessionId: plos-baiyu
        cwd: ''
        greeting: !!js "process.env.QQ_RESIDENT_GREETING ?? ''"
