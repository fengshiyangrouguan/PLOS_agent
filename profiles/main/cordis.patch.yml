# 我们的补丁层：叠在 dsh.profile.bundles 的所有 bundle 层之上，后写者赢（按 id 逐行定位）。
#
# 两种操作：
#   - insert: [...]        往树里加行（无 id 加到根列表，有 id 加进那个 group）
#   - id: <已有行>  config: {...}   按 id 覆盖已有行的字段（config 是整块替换，不是深合并）
#
# 相对路径的基准是本目录（profiles/main/）。

# 开启插件源码热重载。
# dsh-base 里 hmr 的默认是 root: []（模块监视关闭）——补丁层对 config 是**整块替换**，
# 所以这里要写完整。root 相对 baseDir 解析，而 baseDir = ctx.baseUrl = 本 profile 目录。
# 效果：改 plugins/*.ts 会自动重载；不改则要重启进程。
- id: hmr
  config:
    root: ['./plugins']

# 凭证走**本机 DSH 的那一份**（C:\Users\<你>\.dsh\.credentials.yaml），而不是复制一份到
# $DSH_HOME：复制会过期，而且轮换后两边会不一致。里面是 DeepSeek 账号平台的 OAuth grant，
# 由下面的 llm-deepseek-account 消费。
#
# 用 USERPROFILE 拼路径而不是写死绝对路径，免得这台机器的用户名进版本库。
# 想换成独立凭证库，把 path 改掉或删掉这一节（删掉则回到 $DSH_HOME/.credentials.yaml）。
- id: credentials
  config:
    path: !!js "process.env.USERPROFILE + '/.dsh/.credentials.yaml'"

# 默认模型。
#
# `provider: deepseek-official` 是 llm-deepseek-api-key 那条路线（PROVIDER 常量在
# packages/llm/llm-deepseek-api-key/src/index.ts:15），它默认从环境变量
# DEEPSEEK_API_KEY 取 key（config.ts:16 的 apiKeyEnv 默认值就是这个名字）。
#
# 之前用的是 `deepseek-account`（账号平台 OAuth grant）。实测那条路走不通：
# 常驻会话的 turn 正常跑完、上下文也装配好了（投影缓存里 toolsTokens=5872），
# 但 tokenUsage.totals 全为 0 —— 模型调用没拿到响应。
#
# key 值在 $DSH_HOME/.env（已 gitignore），不在这里。
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash

# 禁掉 DeepSeek 的请求扩展插件 —— **这是绕过，不是修复**。
#
# 症状：启用时每一次模型调用都以
#   finish{reason:{kind:'error',failure:{code:'REQUEST_EXTENSION',
#          message:'DeepSeek request extension preparation failed'}}}
# 结束，且 tokenUsage.totals 全为 0。表现是"agent 那一轮正常跑完但什么都没发生"。
#
# 定位过程（每一步都留了工具，不是猜的）：
#   1. plugins/qq/probe-llm.ts 直连 ctx.llm.stream()，绕开整个 agent
#   2. 最初拿到 NO_ADAPTER —— 但那是竞态假象：探针在树装配完成前就跑了，
#      而 provider 是别的插件在它自己的 apply 里注册的。延迟 20s 后错误才现出真身
#   3. 禁用本插件后立刻成功：finish{kind:'stop'} + 66 个 chunk（含 usage）
#
# 它做的是"插件贡献的附加请求字段"（plugin-contributed request fields），
# 会遍历 Loader 里的插件包清单。我们的 profile 插件是**相对路径的 .ts 文件、
# 不是 npm 包**，很可能就是这里炸的原因 —— 但真正的原因还没查实。
#
# TODO：查明真正原因后恢复本行。届时把这条 disable 删掉即可。
- id: deepseek-llm-api-extensions
  disabled: true

- insert:
    # 开发用：装上 cordis 的 console logger exporter。
    # dsh-base 里没有这一行——不装的话 ctx.logger 的输出没有去处（logger 服务本身是
    # cordis 核心，但 exporter 是独立插件）。级别：0=ERROR 1=INFO 2=WARN 3=DEBUG。
    - id: logger-console
      name: '@deepseek-ai/cordis-plugin-logger-console'
      config:
        levels:
          default: 1
          # 开发期看 qq-adapter 的连接与收消息细节；上线前调回 1。
          qq-adapter: 3

    # 探针 A：只验证补丁层 → 装配树 → 模块加载 → 激活
    - id: hello
      name: './plugins/hello.ts'

    # 探针 B：验证树外 bare import 解析 + inject 激活 + 服务注册
    - id: probe-tools
      name: './plugins/probe-tools.ts'

    # QQ 能力 seam：OneBot v11 WebSocket 客户端，连 SnowLuma 的协议端。
    # 连不上会按退避重连，不阻塞装配——所以协议端还没起来也能正常启动。
    # provide('qq')，供 qq-tools 调用。
    #
    # accessToken 从环境变量取，**不落进版本库**：值写在 $DSH_HOME/.env
    # （已被 .gitignore 忽略），DSH 启动时经 loadLayeredEnv 的 user 层注入。
    - id: qq-adapter
      name: './plugins/qq/adapter.ts'
      config:
        wsUrl: ws://127.0.0.1:3001
        accessToken: !!js "process.env.QQ_ACCESS_TOKEN ?? ''"
        selfId: ''

    # 开发探针：把 qq/message 渲染成 LLM 文本打日志，用来验证流水线与当调用范例。
    # 它 inject ['qq']，所以 qq-adapter 激活后才激活。
    - id: qq-probe
      name: './plugins/qq/probe.ts'

    # 工具包装：把 ctx.qq 的能力包成模型可调用的工具。
    # inject ['tools','qq']，两者都就绪后才激活。
    - id: qq-tools
      name: './plugins/qq/tools.ts'

    # 工具调用自检：默认关闭，QQ_TOOL_TEST=<工具名> 才真的调用。
    # 走 ctx.tools.execute 而非直接调服务——只有经过完整工具管道才算验证了工具定义。
    # 发消息类工具会自动撤回。
    - id: qq-probe-tools
      name: './plugins/qq/probe-tools.ts'

    # 「推」：把 QQ 消息变成 user 消息推进白羽的上下文并唤醒她（followup）。
    # 默认 trigger=mention —— 只有 @ 白羽 才推。改成 all 之前想清楚：
    # 那意味着她在所有群里对每条消息开口（包括那个 332 人的群）。
    - id: qq-push
      name: './plugins/qq/push.ts'
      config:
        trigger: mention
        groups: []

    # 常驻 agent：进程一起来就建白羽的会话，让 QQ 那边随时有人可推。
    # headless 启动不创建 agent，没有这一行 qq-push 会一直报"无人可推"。
    # greeting 从环境变量取（默认空 = 启动时不说话）；想冒烟测试就
    #   $env:QQ_RESIDENT_GREETING='...'
    # 这样不用改这个文件，也不必让测试用语进版本库。
    - id: qq-resident
      name: './plugins/qq/resident.ts'
      config:
        sessionId: plos-baiyu
        cwd: ''
        greeting: !!js "process.env.QQ_RESIDENT_GREETING ?? ''"

    # 系统提示词段落（三层里的第③层）：告诉白羽她在 QQ 上、以及不调 qq_send_message
    # 就没人看得见她。没有这一层，实测她收到推送后只在会话里"回答"，群里毫无动静。
    - id: qq-prompt
      name: './plugins/qq/prompt.ts'

    # 模型链路自检：默认关闭（QQ_LLM_PROBE=1 才跑）。绕过整个 agent 直接调
    # ctx.llm.stream()，用来分离"能力层（provider/凭证/网络）"与"会话层"的故障。
    - id: qq-probe-llm
      name: './plugins/qq/probe-llm.ts'
