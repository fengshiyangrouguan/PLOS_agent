# 我们的补丁层：叠在 dsh.profile.bundles 的所有 bundle 层之上，后写者赢（按 id 逐行定位）。
#
# 两种操作：
#   - insert: [...]        往树里加行（无 id 加到根列表，有 id 加进那个 group）
#   - id: <已有行>  config: {...}   按 id 覆盖已有行的字段（config 是整块替换，不是深合并）
#
# 相对路径的基准是本目录（profiles/main/）。

# 开启插件源码热重载。
# dsh-base 里 hmr 的默认是 root: []（模块监视关闭）——补丁层对 config 是**整块替换**，
# 所以这里要写完整。root 相对 baseDir 解析，而 baseDir = ctx.baseUrl = 本 profile 目录。
# 效果：改 plugins/*.ts 会自动重载；不改则要重启进程。
- id: hmr
  config:
    root: ['./plugins']

# 凭证走**本机 DSH 的那一份**（C:\Users\<你>\.dsh\.credentials.yaml），而不是复制一份到
# $DSH_HOME：复制会过期，而且轮换后两边会不一致。里面是 DeepSeek 账号平台的 OAuth grant，
# 由下面的 llm-deepseek-account 消费。
#
# 用 USERPROFILE 拼路径而不是写死绝对路径，免得这台机器的用户名进版本库。
# 想换成独立凭证库，把 path 改掉或删掉这一节（删掉则回到 $DSH_HOME/.credentials.yaml）。
- id: credentials
  config:
    path: !!js "process.env.USERPROFILE + '/.dsh/.credentials.yaml'"

# 默认模型。
#
# `provider: deepseek-official` 是 llm-deepseek-api-key 那条路线（PROVIDER 常量在
# packages/llm/llm-deepseek-api-key/src/index.ts:15），它默认从环境变量
# DEEPSEEK_API_KEY 取 key（config.ts:16 的 apiKeyEnv 默认值就是这个名字）。
#
# 之前用的是 `deepseek-account`（账号平台 OAuth grant）。实测那条路走不通：
# 常驻会话的 turn 正常跑完、上下文也装配好了（投影缓存里 toolsTokens=5872），
# 但 tokenUsage.totals 全为 0 —— 模型调用没拿到响应。
#
# key 值在 $DSH_HOME/.env（已 gitignore），不在这里。
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash

# 请求扩展插件：已恢复启用。曾经的 REQUEST_EXTENSION 已真正修好（见下）。
#
# 真正的元凶是 logger-console 那一行的**裸包名解析失败**：
# plugin-package-inventory-deepseek 要为每个活跃 Loader 条目找出"所属包"
# (packages/llm/plugin-package-inventory-deepseek/src/index.ts:112-125)。
# 裸包名走 packageOf()，解析不到就**直接抛错、不回落**(:124)。
#
#   @deepseek-ai/cordis-plugin-logger-console  <- 解析不到
#   （推测：它是 vendored cordis 插件，不在 DSH 安装的 dependencies+peerDependencies
#     里，所以安装作用域收集不到；dsh-base 那上百个裸包名都在，所以只有它炸）
#
# 证据（对照实验，唯一变量）：
#   启用 logger-console + 启用本插件 -> REQUEST_EXTENSION，每次模型调用都失败
#   禁用 logger-console + 启用本插件 -> finish{kind:'stop'}，48 chunk，含 usage
# 即：两行都启用时坏的是 logger-console；把本插件禁掉只是掩盖症状。
#
# 症状回顾（极具迷惑性）：每次模型调用都以
#   finish{reason:{kind:'error',failure:{code:'REQUEST_EXTENSION', ...}}}
# 结束，tokenUsage.totals 全为 0。表现是"agent 那一轮正常跑完、零错误、什么都没发生"。
#
# 两个观测工具（都不是猜）：
#   plugins/qq/probe-llm.ts  绕开整个 agent 直连 ctx.llm.stream()，把"能力层
#     (provider/凭证/网络)"与"会话层"的故障分开。它自己有个坑：必须延迟，
#     否则拿到的是 NO_ADAPTER 的竞态假象。
#   投影缓存 storages/session_projcache/sessions/<id>.json 里的 tokenUsage /
#     turnBoundary —— 就是它让我们看出"跑了但没耗 token"。
#
# TODO 真正的修复（择一）：
#   a) 把 @deepseek-ai/cordis-plugin-logger-console 加进 profile 的 dependencies
#      并 pnpm install，让它在 profile 作用域里可解析
#   b) 换一个能解析到的 logger exporter
#   c) 查清 vendored cordis 插件为何不进安装作用域（根因，最彻底）
# 修好后删掉下面这条 disable，并恢复 logger-console 那一行。

- insert:
    # 开发用：装上 cordis 的 console logger exporter。
    # dsh-base 里没有这一行——不装的话 ctx.logger 的输出没有去处（logger 服务本身是
    # cordis 核心，但 exporter 是独立插件）。级别：0=ERROR 1=INFO 2=WARN 3=DEBUG。
    - id: logger-console
      name: '@deepseek-ai/cordis-plugin-logger-console'
      config:
        levels:
          default: 1
          # 开发期看 qq-adapter 的连接与收消息细节；上线前调回 1。
          qq-adapter: 3


    # ── 设施 ─────────────────────────────────────────────────────────
    # 数据库设施：**领域无关**（不认识 QQ），provide('db')。
    # 用 Node 内置的 node:sqlite，零依赖 —— 跟着 DSH 自己走
    # （packages/session/session-query-sqlite 也是这么用的）。
    #
    # 路径从环境变量取，**不落进版本库**：$DSH_HOME/data/plos.db。
    #
    # 注意：迁移在激活时跑（幂等），但 disposer **只关连接、不删表** ——
    # 我们的 HMR 会让插件在改文件时卸载重装，删表等于每改一次清空一次库。
    - id: db
      name: './plugins/db/index.ts'
      config:
        path: !!js "process.env.DSH_HOME + '/data/plos.db'"
        verbose: true
    # ── QQ 领域 ──────────────────────────────────────────────────────
    # 目录结构照 DSH 的分法：**分组在「包」级别**（qq/adapter、qq/tools…），
    # 每个包内部保持扁平 —— DSH 的 packages/<group>/<pkg>/src 也是平的
    # （查过 5 个包，src 下没有任何子目录）。
    #
    # 三层纪律的对应：
    #   qq/adapter   ① 能力 seam（执行）—— provide('qq')
    #   qq/tools     ② 工具包装（模型化）
    #   qq/prompt    ③ 提示词（说明）
    #   qq/pipeline  消息段 → LLM 文本（库，被 adapter 拥有，**不是插件**）
    #   qq/protocol  OneBot v11 线上类型（adapter 与 pipeline 共用）
    #   qq/attention 「注意力」—— 订阅感知条目，决定什么值得打断她
    #   qq/resident  常驻会话

    # ① 能力 seam：OneBot v11 WebSocket 客户端，连 SnowLuma 的协议端。
    # 连不上会按退避重连，不阻塞装配 —— 协议端还没起来也能正常启动。
    #
    # accessToken 从环境变量取，**不落进版本库**：值写在 $DSH_HOME/.env
    # （已被 .gitignore 忽略），DSH 启动时经 loadLayeredEnv 的 user 层注入。
    - id: qq-adapter
      name: './plugins/qq/adapter/index.ts'
      config:
        wsUrl: ws://127.0.0.1:3001
        accessToken: !!js "process.env.QQ_ACCESS_TOKEN ?? ''"
        selfId: ''

    # ② 工具包装：把 ctx.qq 的能力包成模型可调用的工具。
    # inject ['tools','qq']，两者都就绪后才激活。
    - id: qq-tools
      name: './plugins/qq/tools/index.ts'

    # ③ 提示词段落：告诉白羽她在 QQ 上。
    #
    # TODO（docs/design.md §二）：现在的措辞是"必须调用 qq_send_message"，
    # 属于"用提示词求模型做事"。设计方向改成用「信息差」驱动 ——
    # 只告诉她"有人 @ 了你，但我没告诉你说了什么"，让她自己决定去看。
    - id: qq-prompt
      name: './plugins/qq/prompt/index.ts'

    # 「注意力」：订阅感知条目，决定什么值得打断她，然后唤醒 agent。
    #
    # 命名定案（见 docs/decisions.md）：词汇分三层——
    #   领域【注册信号】（状态信号 / 唤醒信号）→ 感知层采集渲染成【感知条目】
    #   → 本插件订阅条目并【分配注意力】。所以这里不叫"信号"（那是注册侧的词），
    #   也不叫"push"（它并不在推）。
    #
    # TODO（docs/design.md §四、§七）—— 现在的实现有四个问题，M2 重写：
    #   1. ctx.on('qq/message') —— 订阅的是【QQ 领域的原始事件】，绕过了感知层，
    #      所以天生只能服务 QQ，新闻/手表/手机推的全收不到
    #   2. 领域自己渲染消息正文 —— 该由感知层统一渲染（不含内容）
    #   3. 正文里硬塞行为指令 —— 违反已定纪律「工具返回永不混指令」
    #   4. ctx.qq.drain() 是【读即已读】—— 与"点进去才算已读"矛盾，
    #      会污染读语义，M3 之前必须修
    - id: qq-attention
      name: './plugins/qq/attention/index.ts'
      config:
        trigger: mention
        groups: []

    # 常驻 agent：进程一起来就建白羽的会话，让 QQ 那边随时有人可推。
    # headless 启动不创建 agent，没有这一行 qq-attention 会一直报"无人可推"。
    # greeting 从环境变量取（默认空 = 启动时不说话）。
    - id: qq-resident
      name: './plugins/qq/resident/index.ts'
      config:
        sessionId: plos-baiyu
        cwd: ''
        greeting: !!js "process.env.QQ_RESIDENT_GREETING ?? ''"
